# -----------------------------------------------------------------------------
# FILE PATHS
# -----------------------------------------------------------------------------
paths:
  database: "data/master_registry.sqlite"
  observations: "data/observations/"
  site_info: "data/site_info/"
  flagged_output: "data/flagged/"
  logs: "logs/"

# -----------------------------------------------------------------------------
# DATA SOURCES
# -----------------------------------------------------------------------------
data_sources:
  observations_base_url: "https://assets.globe.gov/protocol-data/transparencies/transparencies{year}.csv"
  start_year: 1995
  end_year: 2025
  site_info_url: "https://assets.globe.gov/site-data/hydrologySiteVersions.csv"
  site_info_filename: "hydrologySiteVersions.csv"

# -----------------------------------------------------------------------------
# DISTANCE TO WATER BODY
# -----------------------------------------------------------------------------
distance_to_water:
  enabled: true
  database: "data/water_distances.sqlite"
  distance_method: combined    # Options: combined | osm_first | gee_first | osm_only | gee_only
  osm_radius_m: 1000           # Max OSM query radius
  max_distance_m: 1000         # Cap / "not found" sentinel value
  ndwi_threshold: 0.3          # NDWI > threshold = water pixel
  cloud_cover_max_pct: 5       # Sentinel-2 cloud filter
  sentinel_pixel_m: 10         # Sentinel-2 spatial resolution (meters)
  gee_project: null            # GCP project ID for Earth Engine (if null, falls back to local credentials)

# -----------------------------------------------------------------------------
# DATA VALIDATION & HEURISTICS
# -----------------------------------------------------------------------------
validation:
  confidence_level: 0.95
  z_score_threshold: 1.96

  # Physical bounds for validation heuristics
  disk_tolerance_m: 0.5
  tube_tolerance_cm: 2.0
  max_tube_cm: 122.0

# -----------------------------------------------------------------------------
# CONCEPT DRIFT & WEIGHTING
# -----------------------------------------------------------------------------
drift:
  window_years: 10
  min_weight: 0.1

# -----------------------------------------------------------------------------
# BAYESIAN HIERARCHY MAPPING
# -----------------------------------------------------------------------------
# Defines the Level 1 prior pooling category
water_type_col: "water_body_source"

# -----------------------------------------------------------------------------
# BAYESIAN MODEL PARAMETERS & PRIORS
# -----------------------------------------------------------------------------
bayesian_model:
  draws: 4000
  tune: 4000
  chains: 4
  target_accept: 0.95

  # Target columns using original NASA GLOBE terminology
  disk_target_col: "transparency_disk_image_disappearance_m"
  tube_target_col: "tube_image_disappearance_cm"
  
  # Tube length estimation method
  active_tube_length_col: "tube_len_mle_site"

  priors:
    global_baseline_mu: 2.5
    global_baseline_sigma: 1.0
    site_offset_sigma: 0.5
    observation_noise: 0.2